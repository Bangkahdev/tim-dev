name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BANGKAH_SKIP_MODEL_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Compile
        run: python -m compileall -q backend tests main.py office_server.py

      - name: Test
        run: python -m pytest -q

      - name: Package source
        run: |
          mkdir -p dist
          zip -r dist/bangkah-source.zip . \
            -x ".git/*" "data/*" "workspace/*" "reports/*" ".venv/*" "venv/*" \
               "__pycache__/*" "*.pyc" ".pytest_cache/*" "tests/.tmp/*" "cek.py" "dist/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: bangkah-source-${{ github.sha }}
          path: dist/bangkah-source.zip
          if-no-files-found: error
          retention-days: 14
