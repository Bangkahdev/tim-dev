name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whitebox-unit:
    name: White-box & unit (backend core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest bcrypt reportlab python-dotenv pydantic
          # Install crewai/textual if available; Milestone tests ignore workspace artifacts.
          pip install "crewai>=0.100.0" "textual>=0.50.0" || echo "crewai/textual install skipped (non-fatal for unit/whitebox)"
      - name: White-box and unit tests
        env:
          BANGKAH_DB_PATH: ${{ runner.temp }}/ci-office.db
        run: |
          python -m pytest -q \
            tests/test_whitebox_evidence_and_auth.py \
            tests/test_auth_security.py \
            tests/test_company_operations.py \
            tests/test_safe_env.py \
            tests/test_workstations.py \
            tests/test_business_cycle.py \
            tests/test_verify_milestone1_whitebox.py \
            ../it/lan/tests/test_lan_gateway.py \
            --ignore=workspace

  blackbox-api:
    name: Black-box API integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest bcrypt reportlab python-dotenv pydantic crewai textual || true
      - name: Black-box HTTP/API tests
        env:
          BANGKAH_DB_PATH: ${{ runner.temp }}/ci-blackbox.db
        run: |
          python -m pytest -q \
            tests/test_blackbox_api.py \
            tests/test_api_auth_integration.py \
            --ignore=workspace

  full:
    name: Full suite (ignore generated workspace)
    runs-on: ubuntu-latest
    needs: [whitebox-unit, blackbox-api]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest bcrypt reportlab python-dotenv pydantic
          pip install crewai textual || echo "crewai/textual optional for this job"
      - name: Run all backend + it tests (ignore workspace artifacts)
        env:
          BANGKAH_DB_PATH: ${{ runner.temp }}/ci-full.db
        run: |
          python -m pytest tests ../it --ignore=workspace -q
